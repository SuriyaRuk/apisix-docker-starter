# =============================================================================
# APISIX 3.19 — production config (traditional mode, etcd config provider)
#
# Values written as ${{VAR}} / ${{VAR:=default}} are read from the container
# environment at startup (set in .env -> docker-compose.yml). Missing required
# variables make APISIX refuse to start, which is intended.
#
# Full reference: https://github.com/apache/apisix/blob/3.19.0/conf/config.yaml.example
# =============================================================================

apisix:
  node_listen:
    - 9080                       # HTTP  (published as host :80)
  enable_ipv6: false
  enable_http2: true
  enable_server_tokens: false    # hide "Server: APISIX/x.y" version header
  enable_admin: true
  enable_control: true           # Control API: 127.0.0.1:9090 inside the container only
  control:
    ip: 127.0.0.1
    port: 9090

  ssl:
    enable: true
    listen:
      - port: 9443               # HTTPS (published as host :443)
        enable_http3: false
    ssl_protocols: TLSv1.2 TLSv1.3
    ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl_session_tickets: false

  # /status and /status/ready — used by the Docker healthcheck.
  status:
    ip: 127.0.0.1
    port: 7085

  # SSL private keys and plugin secrets (encrypt_fields) are AES-encrypted
  # before being written to etcd. To ROTATE: put the new key FIRST and keep the
  # old key(s) below it — removing an old key makes existing data unreadable.
  data_encryption:
    enable_encrypt_fields: true
    keyring:
      - ${{APISIX_ENCRYPTION_KEY}}   # exactly 32 chars -> AES-256-CBC

  # Trust X-Forwarded-* only from your L4/L7 load balancer. Uncomment when
  # APISIX sits behind an LB (and see nginx_config.http.real_ip_from below).
  # trusted_addresses:
  #   - 10.0.0.0/8

nginx_config:
  error_log_level: warn
  worker_processes: auto
  worker_rlimit_nofile: 65535
  worker_shutdown_timeout: 30s    # keep < stop_grace_period in docker-compose.yml
  event:
    worker_connections: 16384

  http:
    enable_access_log: true
    # JSON access log -> stdout -> Alloy -> Loki (parsed into fields in Grafana)
    access_log_format: '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for","host":"$host","method":"$request_method","uri":"$request_uri","protocol":"$server_protocol","status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent","referer":"$http_referer"}'
    access_log_format_escape: json
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    client_max_body_size: 20m     # APISIX default is 0 (unlimited) — cap it
    send_timeout: 30s
    underscores_in_headers: "on"
    # Real client IP when behind a load balancer: set real_ip_header to the
    # header your LB sets and list the LB CIDRs in real_ip_from.
    real_ip_header: X-Real-IP
    real_ip_recursive: "off"
    real_ip_from:
      - 127.0.0.1
      - "unix:"

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    admin_key_required: true
    admin_key:
      - name: admin
        key: ${{APISIX_ADMIN_KEY}}
        role: admin              # read + write
      - name: viewer
        key: ${{APISIX_VIEWER_KEY}}
        role: viewer             # read only (monitoring, audits, CI diff checks)
    enable_admin_cors: false
    enable_admin_ui: true        # embedded Dashboard at http://<admin>/ui/
    # Admin API is published on 127.0.0.1 only. Traffic arriving through the
    # Docker port mapping is source-NATed to the gateway (.1) of one of the
    # container's networks — Docker picks which — so allow exactly those
    # gateway IPs. Other containers on these networks (.2+) stay blocked.
    allow_admin:
      - 127.0.0.0/24
      - ${{ADMIN_ALLOW_GW_EDGE:=172.30.0.1/32}}
      - ${{ADMIN_ALLOW_GW_OBS:=172.30.1.1/32}}
      - ${{ADMIN_ALLOW_GW_UPSTREAM:=172.30.2.1/32}}
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    admin_api_version: v3

  etcd:
    host:
      - http://etcd-1:2379
      - http://etcd-2:2379
      - http://etcd-3:2379
    prefix: /apisix
    timeout: 30
    watch_timeout: 50
    startup_retry: 5
    user: ${{ETCD_APISIX_USER:=apisix}}
    password: ${{ETCD_APISIX_PASSWORD}}

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    metric_prefix: apisix_
    enable_export_server: true
    export_addr:                 # scraped by Prometheus over the internal network;
      ip: 0.0.0.0                # NOT published on the host.
      port: 9091
  log-rotate:                    # access/error logs go to stdout/stderr in this
    interval: 3600               # image; Docker's json-file driver rotates them.
    max_kept: 24
