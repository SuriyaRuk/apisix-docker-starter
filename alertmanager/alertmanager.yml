# Alertmanager — routes alerts from Prometheus to people.
# By default alerts go to the "default" receiver, which does nothing.
# Uncomment ONE receiver block below and point `route.receiver` to it.
global:
  resolve_timeout: 5m
  # smtp_smarthost: "smtp.example.com:587"
  # smtp_from: "apisix-alerts@example.com"
  # smtp_auth_username: "apisix-alerts@example.com"
  # smtp_auth_password_file: /etc/alertmanager/smtp_password

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 1h

inhibit_rules:
  # If a critical alert fires, mute the matching warning.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["alertname"]

receivers:
  - name: default
