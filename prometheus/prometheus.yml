# Prometheus — scrapes APISIX, etcd, host and the monitoring stack itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: apisix-prod          # change per environment (prod / uat / dr ...)

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ["apisix:9091"]

  - job_name: etcd
    static_configs:
      - targets: ["etcd-1:2381", "etcd-2:2381", "etcd-3:2381"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
