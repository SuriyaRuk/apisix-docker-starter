groups:
  - name: apisix
    rules:
      - alert: APISIXDown
        expr: up{job="apisix"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "APISIX metrics endpoint is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 1m — gateway may be down."

      - alert: APISIXEtcdUnreachable
        expr: max(apisix_etcd_reachable) == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "APISIX cannot reach etcd"
          description: "APISIX keeps serving the last known config, but no config changes will apply."

      - alert: APISIXHigh5xxRate
        expr: |
          sum(rate(apisix_http_status{code=~"5.."}[5m]))
            / clamp_min(sum(rate(apisix_http_status[5m])), 1) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "APISIX 5xx rate > 5%"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5m."

      - alert: APISIXRoute5xxRate
        expr: |
          sum by (route) (rate(apisix_http_status{code=~"5..",route!=""}[5m]))
            / clamp_min(sum by (route) (rate(apisix_http_status{route!=""}[5m])), 0.1) > 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Route {{ $labels.route }} 5xx rate > 10%"

      - alert: APISIXHighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(apisix_http_latency_bucket{type="request"}[5m]))) > 2000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "APISIX p99 request latency > 2s"
          description: "p99 = {{ $value | humanize }} ms"

      - alert: APISIXHighActiveConnections
        expr: max(apisix_nginx_http_current_connections{state="active"}) > 50000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "APISIX active connections > 50k"

      - alert: APISIXSharedDictAlmostFull
        expr: |
          apisix_shared_dict_free_space_bytes / apisix_shared_dict_capacity_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "APISIX shared dict {{ $labels.name }} < 10% free"
          description: "Increase nginx_config.meta.lua_shared_dict.{{ $labels.name }} and restart."

  - name: etcd
    rules:
      - alert: EtcdMemberDown
        expr: up{job="etcd"} == 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "etcd member {{ $labels.instance }} is down"

      - alert: EtcdQuorumAtRisk
        expr: count(up{job="etcd"} == 1) < 2
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "etcd has lost quorum (fewer than 2 of 3 members up)"

      - alert: EtcdNoLeader
        expr: etcd_server_has_leader == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "etcd member {{ $labels.instance }} has no leader"

      - alert: EtcdFrequentLeaderChanges
        expr: increase(etcd_server_leader_changes_seen_total[1h]) > 3
        labels: { severity: warning }
        annotations:
          summary: "etcd leader changed > 3 times in 1h (disk/network latency?)"

      - alert: EtcdDatabaseNearQuota
        expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "etcd DB on {{ $labels.instance }} > 80% of quota"
          description: "Run defrag (see README) or raise ETCD_QUOTA_BACKEND_BYTES."

      - alert: EtcdSlowFsync
        expr: |
          histogram_quantile(0.99, sum by (instance, le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "etcd WAL fsync p99 > 500ms on {{ $labels.instance }} — slow disk"

  - name: host
    rules:
      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU > 85% for 10m"

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Host available memory < 10%"

      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|virtiofs|fuse.*|nsfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|virtiofs|fuse.*|nsfs"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} < 15% free"

  - name: monitoring
    rules:
      - alert: ScrapeTargetDown
        expr: up{job!~"apisix|etcd"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} is down"
